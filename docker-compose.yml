version: '3.8'

services:
  fastapi-serving:
    build: .
    container_name: churnguard-serving
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MLFLOW_TRACKING_URI=sqlite:////app/data/mlflow.db
    volumes:
      - ./data:/app/data
    restart: always

  mlflow-ui:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: churnguard-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    command: mlflow ui --backend-store-uri sqlite:////data/mlflow.db --host 0.0.0.0 --port 5000
    restart: unless-stopped
