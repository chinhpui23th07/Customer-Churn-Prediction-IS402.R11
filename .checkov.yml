# Checkov Enterprise Policy Configuration & Scope Justification
# Project: ChurnGuard MLOps Level 2 Enterprise Platform
# Constraint Baseline: Monthly Budget Cap ($75.00 USD Target) & Single-Region SEA Architecture

framework:
  - terraform
  - arm

skip-check:
  - CKV_AZURE_165  # ACR Geo-replication: Multi-region ACR replication exceeds the $75/mo FinOps ceiling; workload targets Southeast Asia (Singapore) single region.
  - CKV_AZURE_233  # ACR Zone Redundancy: Requires ACR Premium SKU which exceeds the $75/mo FinOps ceiling; Basic SKU evaluated for baseline.
  - CKV_AZURE_163  # ACR Vulnerability Scanning: Requires Microsoft Defender for Containers; Trivy FS/Container scanning runs in CI instead.
  - CKV_AZURE_164  # ACR Content Trust: Requires ACR Premium SKU for Docker Content Trust (DCT) key signing.
  - CKV_AZURE_166  # ACR Quarantine Policy: Requires ACR Premium SKU to isolate unscanned images.
  - CKV_AZURE_237  # ACR Dedicated Data Endpoints: Requires ACR Premium SKU for dedicated storage endpoints.
  - CKV_AZURE_206  # Storage Replication: Baseline uses Standard_LRS (Locally Redundant Storage) to maintain $75/mo cost target.
  - CKV2_AZURE_1   # Storage Customer Managed Keys (CMK): Requires Dedicated HSM / Key Vault Premium Key Management beyond baseline FinOps target.
  - CKV2_AZURE_33  # Storage Private Endpoint: Private Endpoints require VNet peering, Private DNS Zones and NAT gateway beyond baseline FinOps scope.
  - CKV2_AZURE_41  # Storage SAS Expiration Policy: shared_access_key_enabled = false and User-Assigned Managed Identity with Storage Blob Data Contributor role are used instead of SAS tokens.
  - CKV2_AZURE_21  # Blob Service Logging: Managed diagnostic settings via Log Analytics workspace (law-churnguard-mlops).
  - CKV_SECRET_6   # False positive on environment variable secretRef token substitutions in containerapp.yaml.
