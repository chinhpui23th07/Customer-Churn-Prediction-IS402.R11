name: KKBox Test and Deploy on Ephemeral Runner

on:
  push:
    branches: [ main, feat/kkbox-churn-pipeline-pilot, feat/kkbox-mlops-deploy-ready ]
    paths:
      - .github/workflows/kkbox_smoke_deploy_runner.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: "Test and deploy API/Web on the target Azure VM"
        type: boolean
        required: true
        default: false
      target_url:
        description: "Public HTTPS root URL to verify after deploy"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: kkbox-vm-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    if: ${{ github.event_name == 'push' || inputs.deploy == true }}
    runs-on: [self-hosted, linux, x64, kkbox]
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      MLFLOW_DISABLE_AGENT_HINT: "1"
      TARGET_PUBLIC_URL: ${{ inputs.target_url || vars.KKBOX_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Test KKBox API and three Web modes
        run: /home/azureuser/churn/.venv/bin/python -m pytest tests/test_kkbox_api.py tests/test_kkbox_web.py -q
      - name: Deploy API and Web after tests pass
        run: bash deploy/kkbox/deploy_from_runner.sh
      - name: Verify public HTTPS endpoint
        if: ${{ env.TARGET_PUBLIC_URL != '' }}
        run: |
          /home/azureuser/churn/.venv/bin/python - <<'PY'
          import json
          import os
          import urllib.request
          root = os.environ["TARGET_PUBLIC_URL"].rstrip("/")
          with urllib.request.urlopen(root + "/health", timeout=20) as response:
              status = json.load(response)
          assert status["status"] == "ready" and status["mode"] in ("pilot", "full"), status
          with urllib.request.urlopen(root + "/demo", timeout=20) as response:
              page = response.read().decode("utf-8")
          assert all(f'data-mode="{mode}"' in page for mode in ("manual", "batch", "lookup"))
          print("PUBLIC_HTTPS_READY", status)
          PY
