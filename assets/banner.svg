<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="50%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#061221"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Geometric Grid / Patterns -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Main Shield Graphic -->
  <g transform="translate(80, 70)">
    <path d="M70 10 L130 30 V90 C130 135 95 160 70 175 C45 160 10 135 10 90 V30 Z" fill="#0F766E" opacity="0.3"/>
    <path d="M70 20 L120 38 V88 C120 126 90 148 70 160 C50 148 20 126 20 88 V38 Z" fill="url(#tealGrad)"/>
    <path d="M40 92 L55 92 L65 65 L78 115 L90 82 L98 92 L105 92" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="78" cy="115" r="5" fill="#F59E0B"/>
  </g>

  <!-- Content -->
  <text x="260" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#F8FAFC" letter-spacing="-1">
    CHURN<tspan fill="url(#goldGrad)">GUARD</tspan> MLOPS
  </text>
  <text x="260" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">
    Enterprise Customer Churn Prediction &amp; Automated Pipeline
  </text>

  <!-- Feature Badges -->
  <g transform="translate(260, 195)">
    <!-- Badge 1: Feast -->
    <rect x="0" y="0" width="165" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="15" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#38BDF8">Feast Feature Store</text>

    <!-- Badge 2: MLflow -->
    <rect x="180" y="0" width="175" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="195" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#F59E0B">MLflow Tracking</text>

    <!-- Badge 3: FastAPI -->
    <rect x="370" y="0" width="165" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="385" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#10B981">FastAPI Serving</text>

    <!-- Badge 4: Evidently -->
    <rect x="550" y="0" width="180" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="565" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#A855F7">Evidently AI Drift</text>

    <!-- Badge 5: DVC & CI/CD -->
    <rect x="745" y="0" width="145" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="760" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#F43F5E">DVC &amp; CI/CD</text>
  </g>

  <!-- Footnote -->
  <text x="260" y="275" font-family="sans-serif" font-size="14" font-weight="400" fill="#64748B">
    High-Performance Customer Retention &amp; Production MLOps Serving Engine
  </text>
</svg>
