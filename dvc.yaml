stages:
  download_data:
    cmd: python src/data/download_dataset.py
    deps:
      - src/data/download_dataset.py
    params:
      - configs/model_params.yaml:
          - dataset
    outs:
      - data/raw/customer_churn_dataset-training-master.csv
      - data/raw/customer_churn_dataset-testing-master.csv

  preprocess:
    cmd: python src/data/preprocess.py
    deps:
      - src/data/preprocess.py
      - data/raw/customer_churn_dataset-training-master.csv
      - data/raw/customer_churn_dataset-testing-master.csv
    params:
      - configs/model_params.yaml:
          - preprocessing
    outs:
      - data/processed/train_features.parquet
      - data/processed/val_features.parquet
      - data/processed/test_features.parquet
      - data/processed/scaler.joblib
      - data/processed/metadata.json

  data_quality:
    cmd: python src/data/data_quality.py
    deps:
      - src/data/data_quality.py
      - data/processed/train_features.parquet
    params:
      - configs/model_params.yaml:
          - data_quality
    metrics:
      - data/processed/data_quality_report.json:
          cache: false

  feature_store:
    cmd: python src/features/feature_store.py
    deps:
      - src/features/feature_store.py
      - data/processed/train_features.parquet
      - data/processed/val_features.parquet
      - data/processed/test_features.parquet
    params:
      - configs/model_params.yaml:
          - feature_store
    outs:
      - data/feast_repo/churn_features.parquet

  tune_optuna:
    cmd: python src/models/tune_optuna.py
    deps:
      - src/models/tune_optuna.py
      - data/processed/train_features.parquet
    params:
      - configs/model_params.yaml:
          - optuna
    metrics:
      - data/models/tuning_history.json:
          cache: false

  train_models:
    cmd: python src/models/train_pipeline.py
    deps:
      - src/models/train_pipeline.py
      - data/processed/train_features.parquet
      - data/processed/val_features.parquet
      - data/processed/test_features.parquet
      - data/processed/scaler.joblib
      - data/processed/metadata.json
      - data/models/tuning_history.json
    params:
      - configs/model_params.yaml:
          - models
    outs:
      - data/models/champion_model.joblib
      - data/models/evaluation_results.json

  evaluate_and_benchmark:
    cmd: python src/models/evaluate.py
    deps:
      - src/models/evaluate.py
      - data/models/champion_model.joblib
      - data/models/evaluation_results.json
      - data/processed/test_features.parquet
    params:
      - configs/model_params.yaml:
          - evaluation
    metrics:
      - data/processed/model_evaluation_report.json:
          cache: false

  model_diagnostics:
    cmd: python src/models/model_diagnostics.py
    deps:
      - src/models/model_diagnostics.py
      - data/models/champion_model.joblib
      - data/processed/train_features.parquet
      - data/processed/test_features.parquet
    params:
      - configs/model_params.yaml:
          - evaluation
    metrics:
      - data/processed/error_analysis_report.json:
          cache: false

  drift_detector:
    cmd: python src/monitoring/drift_detector.py
    deps:
      - src/monitoring/drift_detector.py
      - data/processed/train_features.parquet
      - data/processed/test_features.parquet
    params:
      - configs/model_params.yaml:
          - monitoring
    metrics:
      - data/processed/drift_metrics.json:
          cache: false

  kkbox_download_full:
    cmd: python scripts/download_kkbox.py --scope full
    deps:
      - scripts/download_kkbox.py
      - docs/experiments/kkbox_parquet_manifest.json
    outs:
      - data/kkbox_raw
    metrics:
      - docs/experiments/kkbox_download_report.json:
          cache: false

  kkbox_etl_full:
    cmd: python -m src.kkbox.run_etl --sample-modulus 1
    deps:
      - data/kkbox_raw
      - docs/experiments/kkbox_parquet_manifest.json
      - src/kkbox/contract.py
      - src/kkbox/features.py
      - src/kkbox/run_etl.py
    outs:
      - data/kkbox_processed/features
    metrics:
      - docs/experiments/kkbox_etl_audit.json:
          cache: false

  kkbox_train_full:
    cmd: python -m src.kkbox.train --mode full
    deps:
      - data/kkbox_processed/features
      - docs/experiments/kkbox_etl_audit.json
      - src/kkbox/contract.py
      - src/kkbox/train.py
    outs:
      - data/kkbox_models/champion_model.joblib
      - data/kkbox_models/model_metadata.json
    metrics:
      - docs/experiments/kkbox_model_report.json:
          cache: false

  kkbox_feast_full:
    cmd: python -m src.kkbox.prepare_feast
    deps:
      - data/kkbox_processed/features
      - data/kkbox_feast/definitions.py
      - data/kkbox_feast/feature_store.yaml
      - src/kkbox/prepare_feast.py
    outs:
      - data/kkbox_feast/churn_features.parquet
    metrics:
      - docs/experiments/kkbox_feast_report.json:
          cache: false
