# ==============================================================================
# ChurnGuard MLOps - Production Model & Pipeline Configuration
# Governing Standard: AGENTS.md v3.4 Enterprise Specification
# Referenced by: dvc.yaml across KKBox Big Data MLOps DAG stages
# ==============================================================================

dataset:
  name: "vaibhavkhurana/subscriber-retention-intelligence"
  title: "KKBox Customer Churn Benchmark Big Data (7.52 GB)"
  canonical_source: "https://huggingface.co/datasets/vaibhavkhurana/subscriber-retention-intelligence"
  manifest: "docs/experiments/kkbox_parquet_manifest.json"
  raw_dir: "data/kkbox_raw"
  sample_dir: "data/kkbox_sample_raw"
  processed_dir: "data/kkbox_processed/features"
  feast_parquet: "data/kkbox_feast/churn_features.parquet"
  models_dir: "data/kkbox_models"
  total_published_parquet_files: 32
  total_published_parquet_bytes: 7522254856
  total_rows: 442211685
  expected_rows: 442211685
  tables:
    churn_label:
      files: 2
      rows: 1963891
      bytes: 15720822
    listening_day:
      files: 27
      rows: 410502905
      bytes: 6982487551
    member:
      files: 1
      rows: 6769473
      bytes: 60491935
    subscription_transaction:
      files: 2
      rows: 22975416
      bytes: 463554548
  target_column: "is_churn"
  entity_id_column: "subscriber_key"
  schema_compat:
    target_column: "is_churn"
    entity_id_column: "subscriber_key"

kkbox:
  feature_version: "kkbox-v1"
  windows:
    "2017-02":
      source: "train"
      cutoff: "2017-01-31"
    "2017-03":
      source: "train_v2"
      cutoff: "2017-02-28"
  feature_columns:
    - "txn_count_30d"
    - "paid_amount_30d"
    - "cancel_count_90d"
    - "days_since_last_txn"
    - "last_auto_renew"
    - "days_until_expiry"
    - "active_days_30d"
    - "listening_secs_30d"
    - "days_since_last_listen"
    - "registration_tenure_days"
    - "has_txn_history"
    - "has_listening_history"
  duckdb_memory_limit: "2GB"
  out_of_core_spill_dir: "data/processed/.duckdb_temp"
  metrics:
    throughput_rows_per_sec: 6707531
    throughput_entities_per_sec: 173091
    scan_time_sec: 5.61

preprocessing:
  train_split_ratio: 0.70
  val_split_ratio: 0.15
  test_split_ratio: 0.15
  stratify_column: "is_churn"
  random_state: 42
  out_of_core_chunk_size: 100000
  feature_names:
    - "txn_count_30d"
    - "paid_amount_30d"
    - "cancel_count_90d"
    - "days_since_last_txn"
    - "last_auto_renew"
    - "days_until_expiry"
    - "active_days_30d"
    - "listening_secs_30d"
    - "days_since_last_listen"
    - "registration_tenure_days"
    - "has_txn_history"
    - "has_listening_history"
  numeric_cols:
    - "txn_count_30d"
    - "paid_amount_30d"
    - "cancel_count_90d"
    - "days_since_last_txn"
    - "last_auto_renew"
    - "days_until_expiry"
    - "active_days_30d"
    - "listening_secs_30d"
    - "days_since_last_listen"
    - "registration_tenure_days"
    - "has_txn_history"
    - "has_listening_history"
  category_mappings: {}

data_quality:
  iqr_multiplier: 3.0
  zscore_threshold: 3.5
  min_contract_success_rate: 95.0
  feature_bounds:
    txn_count_30d: [0, 1000]
    paid_amount_30d: [0.0, 100000.0]
    cancel_count_90d: [0, 100]
    days_since_last_txn: [0, 3650]
    last_auto_renew: [0, 1]
    days_until_expiry: [-3650, 3650]
    active_days_30d: [0, 31]
    listening_secs_30d: [0.0, 8640000.0]
    days_since_last_listen: [0, 3650]
    registration_tenure_days: [0, 36500]
    has_txn_history: [0, 1]
    has_listening_history: [0, 1]
    is_churn: [0, 1]

feature_store:
  repo_path: "data/kkbox_feast"
  offline_source: "data/kkbox_feast/churn_features.parquet"
  online_store_db: "data/kkbox_feast/data/online_store.db"
  entity_name: "snapshot_key"
  join_key: "snapshot_key"
  feature_view_name: "kkbox_churn_features"
  ttl_days: null
  redis_cooldown_sec: 30.0
  redis_timeout_sec: 0.2

optuna:
  sampler: "TPESampler"
  direction: "maximize"
  metric: "roc_auc"
  n_trials: 12
  n_startup_trials: 5
  multivariate: true
  cv_folds: 3
  seed: 42
  sample_size: 25000
  xgboost_search_space:
    n_estimators_min: 80
    n_estimators_max: 160
    n_estimators_step: 20
    max_depth_min: 4
    max_depth_max: 8
    learning_rate_min: 0.04
    learning_rate_max: 0.12
    subsample_min: 0.70
    subsample_max: 0.95
    colsample_bytree_min: 0.70
    colsample_bytree_max: 0.95
  random_forest_search_space:
    n_estimators_min: 60
    n_estimators_max: 120
    n_estimators_step: 20
    max_depth_min: 8
    max_depth_max: 14
    min_samples_split_min: 2
    min_samples_split_max: 6

models:
  cv_folds: 5
  random_state: 42
  scoring: "roc_auc"
  champion_algorithm: "XGBoost"
  challenger_algorithm: "Random_Forest"
  mlflow_experiment_name: "Customer_Churn_Prediction_Enterprise"
  registered_model_name: "CustomerChurnChampion"
  logistic_regression:
    solver: "lbfgs"
    max_iter: 1000
    class_weight: "balanced"
    penalty: "l2"
    use_scaled: true
  random_forest:
    n_estimators: 150
    max_depth: 12
    min_samples_split: 5
    random_state: 42
    n_jobs: -1
    use_scaled: false
  xgboost:
    n_estimators: 140
    max_depth: 5
    learning_rate: 0.0886
    subsample: 0.8367
    random_state: 42
    n_jobs: -1
    use_scaled: false
  lightgbm:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.05
    random_state: 42
    n_jobs: -1
    use_scaled: false

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "roc_auc"
    - "pr_auc"
  primary_metric: "roc_auc"
  decision_threshold: 0.50
  calibration_n_bins: 10
  learning_curve_splits: 3
  learning_curve_max_samples: 25000
  subgroup_non_monthly_auc_benchmark: 0.9992

monitoring:
  ks_p_val_threshold: 0.05
  bonferroni_correction: true
  psi_threshold_stable: 0.10
  psi_threshold_moderate: 0.25
  dataset_drift_share_threshold: 0.30
  psi_num_buckets: 10
  psi_epsilon: 0.0001
  max_inference_log_window: 5000
  evidently_sample_size: 3000
  wasserstein_threshold: 0.10
  big_data_sample_threshold: 1000
